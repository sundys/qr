name: build-patched-ipa

# 在 CI 里把 AdsKiller.dylib 注入原始 IPA，重签后产出新的 IPA。
#
# ⚠️ 使用前必读：
#   1. 原始 IPA 不能提交到仓库（有版权）。请把它作为 **release 资产** 上传，
#      tag 用 base-ipa；或者用 base_ipa_url 指定一个私密下载地址。
#   2. publish_release（默认 true）会把改过的 IPA 挂成 **草稿 release（--draft）**：
#      只有本仓库有写权限的人（也就是你自己）登录后才能看到和下载，匿名拿不到，
#      所以不会构成公开分发。等确认可用后，再到 Releases 页面手动点 Publish 转正。
#      注意：草稿比"仅登录可见"更严 —— 别人即使登录了，没有仓库写权限也看不到。

on:
  workflow_dispatch:
    inputs:
      base_ipa_url:
        description: '原始 IPA 下载地址（留空则从本仓库 release 资产下载）'
        required: false
        default: ''
      base_release_tag:
        description: '原始 IPA 所在的 release tag'
        required: false
        default: 'base-ipa'
      publish_release:
        description: '是否把产物挂成 release 资产（草稿 release：仅自己登录后可下载，默认是）'
        required: true
        type: choice
        options: ['true', 'false']
        default: 'true'
      release_tag:
        description: '发布用的 tag（publish_release=true 时生效）'
        required: false
        default: 'noads-4.0.3'

jobs:
  patch:
    runs-on: macos-14
    permissions:
      contents: write          # 仅 publish_release=true 时需要
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖 (lief / ldid / zip)
        run: |
          python3 -m pip install --quiet --break-system-packages lief \
            || python3 -m pip install --quiet --user lief \
            || pip3 install --quiet lief
          brew install ldid || true
          python3 -c "import lief; print('lief', lief.__version__)"

      - name: 获取原始 IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p base
          if [ -n "${{ inputs.base_ipa_url }}" ]; then
            echo "[*] 从 URL 下载"
            curl -fsSL -o base/base.ipa "${{ inputs.base_ipa_url }}"
          else
            echo "[*] 从 release 资产下载 (tag=${{ inputs.base_release_tag }})"
            gh release download "${{ inputs.base_release_tag }}" \
               -R "${{ github.repository }}" -p '*.ipa' -D base --clobber || {
              echo "::error::没找到原始 IPA。请先把 qrcode-4.0.3.ipa 作为 release 资产上传（tag: ${{ inputs.base_release_tag }}），或填写 base_ipa_url。"
              exit 1
            }
          fi
          ls -lh base
          file base/base.ipa

      - name: 编译 hook dylib
        run: ./tweak/build_dylib.sh

      - name: 解包 + 保存原 entitlements + 注入
        run: |
          set -e
          unzip -q base/*.ipa -d work
          APP="$(find work/Payload -maxdepth 1 -name '*.app' | head -1)"
          test -n "$APP" || { echo "::error::IPA 里没有 Payload/*.app"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          BIN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

          # 关键顺序：必须在注入前取 entitlements（注入会把旧签名整个剥掉）。
          # 砸壳包的签名常常是坏的，ldid -e 可能直接断言退出，所以容错 + 用仓库里
          # 预置的 tweak/entitlements.plist 兜底（内容就是原包那三个 entitlement）。
          ldid -e "$APP/$BIN" > ents.extracted 2>/dev/null || true
          if head -c 5 ents.extracted 2>/dev/null | grep -q '<?xml'; then
            cp ents.extracted ents.plist
            echo "[*] entitlements 来源: 原二进制"
          else
            cp tweak/entitlements.plist ents.plist
            echo "[*] entitlements 来源: 仓库预置兜底"
          fi
          echo "----- entitlements -----"; cat ents.plist

          python3 tweak/tools/inject_dylib.py "$APP" tweak/AdsKiller.dylib

          python3 -c "import lief;b=lief.parse('$APP/$BIN');print('[*] 注入后 has_code_signature =', b.has_code_signature)"

      - name: 重签 + 打包
        run: |
          set -e
          # 依次尝试：ldid(带 entitlements) -> ldid(ad-hoc) -> codesign(带 entitlements) -> codesign(ad-hoc)
          sign() {
            local f="$1" e="${2:-}"
            if [ -n "$e" ] && [ -s "$e" ] && ldid -S "$e" "$f" 2>/dev/null; then echo "      -> ldid + entitlements"; return 0; fi
            if ldid -S "$f" 2>/dev/null; then echo "      -> ldid ad-hoc"; return 0; fi
            if [ -n "$e" ] && [ -s "$e" ] && codesign -f -s - --entitlements "$e" "$f" 2>/dev/null; then echo "      -> codesign + entitlements"; return 0; fi
            if codesign -f -s - "$f" 2>/dev/null; then echo "      -> codesign ad-hoc"; return 0; fi
            return 1
          }

          echo "[*] 签名主程序 $BIN"
          sign "$APP/$BIN" ents.plist || { echo "::error::主程序签名失败（ldid 与 codesign 都失败）"; exit 1; }

          echo "[*] 签名注入的 dylib"
          sign "$APP/AdsKiller.dylib" || { echo "::error::dylib 签名失败"; exit 1; }

          codesign -dv "$APP/$BIN" 2>&1 | head -8 || true

          export COPYFILE_DISABLE=1
          OUT="SimpleQR-4.0.3-noads.ipa"
          ( cd work && zip -qry "../$OUT" Payload -x '.*' -x '__MACOSX/*' )
          ls -lh "$OUT"
          unzip -l "$OUT" | head -20
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: 校验产物
        run: |
          set -e
          rm -rf verify && mkdir verify && unzip -q "$OUT" -d verify
          APP="$(find verify/Payload -maxdepth 1 -name '*.app' | head -1)"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          python3 - "$APP" "$EXE" <<'EOF'
          import os, sys, lief
          app, exe = sys.argv[1], sys.argv[2]
          main = os.path.join(app, exe)
          b = lief.parse(main)
          libs = [l.name for l in b.libraries]
          assert '@executable_path/AdsKiller.dylib' in libs, libs
          dylib = os.path.join(app, 'AdsKiller.dylib')
          assert os.path.isfile(dylib), 'dylib 不在 app 里'
          db = lief.parse(dylib)
          print('main:', exe, '| ncmds', b.header.nb_cmds)
          print('dylib:', os.path.getsize(dylib), 'bytes | filetype', db.header.file_type)
          print('OK: 注入与打包校验通过')
          EOF

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: SimpleQR-noads-ipa
          path: SimpleQR-4.0.3-noads.ipa
          if-no-files-found: error

      - name: 发布为 release 资产（草稿）
        if: inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ inputs.release_tag }}"
          # --draft：草稿 release，只有本仓库有写权限的人（也就是你自己）登录后才能看到和下载，
          # 匿名访问者拿不到 —— 避免把改过的第三方 App 公开分发出去。
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "${{ github.repository }}" --draft \
              --title "SimpleQR 4.0.3 去广告版 ($TAG)" \
              --notes "在原始 IPA 基础上注入 AdsKiller hook 去广告。仅供个人设备使用，请勿再分发。" || true
          gh release upload "$TAG" "$OUT" -R "${{ github.repository }}" --clobber
          echo "已发布（草稿）: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
          echo "需要登录且对该仓库有写权限才能下载；确认没问题后再在 Releases 页面手动点 Publish 转正。"
